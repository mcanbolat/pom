<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* auto-refresh when a newer version is published */
(function(){var V="11";fetch("../../version.txt?"+Date.now(),{cache:"no-store"}).then(function(r){return r.text()}).then(function(v){v=v.trim();if(v&&v!==V){var k="pom_reload_"+v;try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,1)}catch(e){}location.reload()}}).catch(function(){})})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Balancing Puzzle — POM Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../pom.css?v=11">
<script src="../../vendor/supabase.js?v=11"></script>
<script src="../../vendor/chart.umd.min.js?v=11"></script>
<script src="../../config.js?v=11"></script>
<script src="../../pom.js?v=11"></script>
<script src="../../pom-game.js?v=11"></script>
<script src="model.js?v=11"></script>
<style>
  .net svg{width:100%;height:auto}
  .loads{display:flex;flex-direction:column;gap:6px}
  .ld{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;font-size:13px}
  .ld .bar{height:20px;background:var(--soft);border-radius:5px;position:relative;overflow:hidden}
  .ld .bar div{height:100%}
  .ld .bar .ct{position:absolute;top:0;bottom:0;border-left:2px dashed var(--bad)}
  .issues{color:var(--bad);font-size:13px;margin:8px 0}
  #tt select{width:auto;padding:4px 8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
let X, asg = {}, moves = 0, t0;
const T = LINE.TASKS, PAL = ["#00533e", "#d08a00", "#3b6fb6", "#8a5a44", "#7a5bb5", "#2a9d8f", "#e76f51", "#6d597a", "#588157", "#bc6c25"];

POMGame.start({
  game: "layout", chapter: "Ch. 9", topic: "Layout Strategies", icon: "🛴", title: "Line Balancing Puzzle",
  tagline: "Balance the e-scooter assembly line: assign tasks to stations, respect the order of the work, and use as few stations as possible.",
  defaults: LINE.DEFAULTS,
  bots: () => ["BalanceBoss", "CycleTimeKing", "IdleNoMore", "LineLeader"].map((n, i) => ({ nickname: n, summary: { score: 0.9 - i * .04, stations: "8 / 6" } })),
  board: { label: "Average efficiency", fmt: (v) => (v * 100).toFixed(1) + "%", cols: [["Stations", (s) => s.stations]] },
  run(ctx) { X = ctx; route(); },
  results: (s) => UI.kpis([["Average efficiency", (s.score * 100).toFixed(1) + "%"], ...s.rounds.map((r, k) => [`Round ${k + 1}: stations (best)`, `${r.stations} (${r.opt})`])]) +
    `<div class="goal small">Efficiency = Σ task times ÷ (number of stations × cycle time). The theoretical minimum, Σt ÷ cycle time rounded up, can't always be reached: precedence and the cycle time cap on each station can leave idle time you can't remove. Heizer's heuristics (longest task time first, most following tasks, ranked positional weight) usually get close.</div>`
});

const doneRounds = () => X.ev("balance");
function route() {
  if (X.P.quiz && !X.ev("quiz").length) return quiz();
  const k = doneRounds().length;
  if (k >= X.P.demands.length) return reflect();
  puzzle(k);
}
function diagram(colorOf) {
  const col = { A: 0, B: 1, C: 1, D: 2, E: 2, F: 2, G: 3, H: 3, I: 4, J: 5 }, row = { A: 1, B: 0, C: 2, D: 0, E: 1.3, F: 2.6, G: 0.7, H: 2.6, I: 1.2, J: 1.2 };
  const px = (id) => 20 + col[id] * 125, py = (id) => 15 + row[id] * 48, W = 76, H = 38;
  let s = `<svg viewBox="0 0 760 180" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa39e"/></marker></defs>`;
  T.forEach((t) => t.pre.forEach((p) => s += `<line x1="${px(p) + W}" y1="${py(p) + H / 2}" x2="${px(t.id) - 2}" y2="${py(t.id) + H / 2}" stroke="#9aa39e" stroke-width="1.5" marker-end="url(#ar)"/>`));
  T.forEach((t) => { const c = colorOf && colorOf(t.id);
    s += `<rect x="${px(t.id)}" y="${py(t.id)}" width="${W}" height="${H}" rx="8" fill="${c ? c + "22" : "#fff"}" stroke="${c || "#00533e"}" stroke-width="2"/>
      <text x="${px(t.id) + W / 2}" y="${py(t.id) + 16}" text-anchor="middle" font-weight="700" font-size="14">${t.id}</text><text x="${px(t.id) + W / 2}" y="${py(t.id) + 31}" text-anchor="middle" font-size="12" fill="#5d6762">${t.t} s</text>`; });
  return `<div class="net">${s}</svg></div>`;
}
function taskTable(extra) {
  return UI.table(["Task", "Description", "Time (s)", "Must follow", ...(extra ? ["Station"] : [])],
    T.map((t) => [`<b>${t.id}</b>`, `<span style="text-align:left;display:block">${t.name}</span>`, t.t, t.pre.join(", ") || "–", ...(extra ? [extra(t)] : [])]));
}

// ---------- 1. cycle time & minimum stations ----------
function quiz() {
  const P = X.P, ct = LINE.cycle(P, 0);
  X.el.innerHTML = `<div class="card"><h2>Golden Eagle E-Scooters: the assembly line</h2>
    <p>The plant runs <b>${P.minutes} minutes</b> a day and must build <b>${P.demands[0]} scooters</b> a day. Building one scooter takes these 10 tasks (times in seconds):</p>
    ${diagram(null)}${taskTable(null)}
    <p class="small" style="margin-top:10px"><span class="formula">Cycle time = production time available ÷ units required</span> <span class="formula">Minimum stations = Σ task times ÷ cycle time (round up)</span></p>
    <div id="qq"></div><div id="after"></div></div>`;
  UI.quiz(document.getElementById("qq"), [{ key: "ct", label: "Cycle time (seconds per scooter)", truth: ct, dec: 0, tol: 0.001 },
    { key: "sum", label: "Total of the task times (s)", truth: LINE.total, dec: 0, tol: 0 },
    { key: "min", label: "Theoretical minimum number of stations", truth: LINE.minStations(ct), dec: 0, tol: 0 }], async (st) => {
      try { await X.log(0, "quiz", Object.fromEntries(Object.entries(st).flatMap(([k, v]) => [[k + "_tries", v.tries], [k + "_ok", v.ok]]))); } catch (e) {}
      document.getElementById("after").innerHTML = `<div class="goal small" style="margin-top:10px">Cycle time = ${P.minutes} × 60 ÷ ${P.demands[0]} = <b>${ct} s</b>. Minimum stations = ${LINE.total} ÷ ${ct} = ${(LINE.total / ct).toFixed(2)} → <b>${LINE.minStations(ct)}</b>. Now try to build the line.</div>
        <button class="gold" id="bGo" style="margin-top:10px">Balance the line →</button>`;
      document.getElementById("bGo").onclick = () => puzzle(0);
    });
}

// ---------- 2. assign tasks ----------
function puzzle(k) {
  const P = X.P, ct = LINE.cycle(P, k), maxS = 10;
  t0 = t0 || performance.now();
  const c = LINE.check(asg, ct), used = Object.keys(c.loads).map(Number).sort((a, b) => a - b);
  X.el.innerHTML = `<div class="card"><h2>Round ${k + 1} of ${P.demands.length}: ${P.demands[k]} scooters a day → cycle time ${+ct.toFixed(1)} s</h2>
    ${k > 0 ? `<div class="goal small">Demand changed to ${P.demands[k]} a day. Rebalance the line for the new cycle time.</div>` : ""}
    <p class="small">Pick a station for every task. A task can't be at an earlier station than any task it must follow, and no station can have more work than the cycle time.</p>
    <div class="grid2"><div>${diagram((id) => asg[id] ? PAL[(asg[id] - 1) % PAL.length] : null)}<div id="tt">${taskTable((t) => `<select data-t="${t.id}"><option value="">–</option>${Array.from({ length: maxS }, (_, i) => `<option value="${i + 1}" ${asg[t.id] === i + 1 ? "selected" : ""}>Station ${i + 1}</option>`).join("")}</select>`)}</div></div>
    <div><h3>Station loads</h3><div class="loads">${used.map((s) => { const l = c.loads[s], w = Math.min(100, l / (ct * 1.25) * 100);
        return `<div class="ld"><span><b style="color:${PAL[(s - 1) % PAL.length]}">Station ${s}</b></span><div class="bar"><div style="width:${w}%;background:${l > ct ? "#b23a2b" : PAL[(s - 1) % PAL.length]}"></div><div class="ct" style="left:${ct / (ct * 1.25) * 100}%"></div></div><span>${l} / ${+ct.toFixed(1)} s</span></div>`; }).join("") || `<p class="small muted">Assign tasks to see the loads.</p>`}</div>
      ${UI.kpis([["Stations used", c.stations], ["Efficiency", c.stations ? (c.eff * 100).toFixed(1) + "%" : "–"], ["Idle time per cycle", c.stations ? +c.idle.toFixed(1) + " s" : "–"]])}
      <div class="issues">${c.issues.slice(0, 5).map((s) => "• " + s).join("<br>")}</div>
      <button class="gold full" id="bSub" ${c.ok ? "" : "disabled"}>Submit this line</button><div class="err" id="eSub"></div></div></div></div>`;
  X.el.querySelectorAll("select[data-t]").forEach((s) => s.onchange = () => { moves++; if (s.value) asg[s.dataset.t] = +s.value; else delete asg[s.dataset.t]; puzzle(k); });
  document.getElementById("bSub").onclick = async () => {
    const opt = LINE.optimum(ct), row = { round: k + 1, demand: P.demands[k], ct, asg: { ...asg }, stations: c.stations, eff: c.eff, idle: c.idle, opt, min: LINE.minStations(ct), moves, ms: Math.round(performance.now() - t0) };
    document.getElementById("bSub").disabled = true;
    try { await X.log(k + 1, "balance", row); } catch (e) { document.getElementById("eSub").textContent = e.message; document.getElementById("bSub").disabled = false; return; }
    X.el.innerHTML = `<div class="card"><h2>Round ${k + 1}: your line</h2>${UI.kpis([["Your stations", c.stations], ["Best possible", opt], ["Theoretical minimum", row.min], ["Your efficiency", (c.eff * 100).toFixed(1) + "%"], ["Best efficiency", (LINE.total / (opt * ct) * 100).toFixed(1) + "%"]])}
      <div class="goal small">${c.stations === opt ? "🏆 You matched the best possible line." : `The best possible line uses ${opt} stations.`} ${opt > row.min ? ` Note that even the best line can't reach the theoretical minimum of ${row.min}. Precedence and the ${+ct.toFixed(0)} s limit force some idle time.` : ""}</div>
      <button class="gold" id="bN" style="margin-top:10px">${k + 1 >= P.demands.length ? "Finish →" : "Next round →"}</button></div>`;
    moves = 0; t0 = null; document.getElementById("bN").onclick = route;
  };
}
function reflect() {
  X.el.innerHTML = `<div class="card" style="max-width:640px;margin:20px auto"><h2>Before you see the results</h2>
    <p>What rule did you use to decide which task to put on a station next?</p><textarea id="refl" rows="4" maxlength="1500"></textarea>
    <button id="bFin" class="full" style="margin-top:12px">Finish and see results</button><div class="err" id="eFin"></div></div>`;
  document.getElementById("bFin").onclick = async () => {
    const r = doneRounds(), s = { score: r.reduce((t, x) => t + x.eff, 0) / r.length, stations: r.map((x) => x.stations).join(" / "), rounds: r.map((x) => ({ stations: x.stations, opt: x.opt, eff: x.eff })) };
    try { await X.log(0, "reflection", { text: document.getElementById("refl").value.trim().slice(0, 1500) }); await X.finish(s); }
    catch (e) { document.getElementById("eFin").textContent = e.message; }
  };
}
</script>
</body>
</html>
